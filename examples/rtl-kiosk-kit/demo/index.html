<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL kiosk kit demo</title>
  <style>
    body { margin: 0; font: 18px/1.5 system-ui, "Noto Sans Arabic", sans-serif; background: #f6f6f6; color: #111; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px 14px; border: 1px solid #bbb; border-radius: 10px; }
    .kbd { margin-top: 16px; display: grid; gap: 8px; user-select: none; }
    .kbd-row { display: flex; gap: 8px; }
    .kbd-key { flex: 1 1 0; min-height: 52px; font: inherit; border: 1px solid #ccc; border-radius: 10px; background: #fff; }
    .kbd-key:active { background: #e8e8e8; }
    .kbd-backspace, .kbd-shift, .kbd-layout, .kbd-enter { background: #ececec; }
    #status { margin-top: 16px; padding: 10px 14px; border-radius: 10px; background: #fff; }
    #status[data-state="prompt"] { background: #fff4d6; }
    #status[data-state="expired"] { background: #ffe1e1; }
    ul { padding-inline-start: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>طقم الكشك</h1>
    <label for="name">الاسم</label>
    <input id="name" autocomplete="off" inputmode="none">
    <div id="keyboard"></div>
    <p id="greeting"></p>
    <div id="status" data-state="active"></div>
    <h2>الأسعار</h2>
    <ul id="prices"></ul>
  </main>
  <script type="module">
    import { mountKeyboard } from "../src/keyboard/mountKeyboard.js";
    import { createIdleMachine, watchInput } from "../src/idleMachine.js";
    import { formatMoney } from "../src/money.js";
    import { dirForInput, isolate, template } from "../src/bidi.js";

    const input = document.getElementById("name");
    const greeting = document.getElementById("greeting");
    input.addEventListener("input", () => {
      input.dir = dirForInput(input.value);
      greeting.textContent = input.value ? template("مرحبا {name}، طلبك جاهز.", { name: input.value }) : "";
    });
    mountKeyboard(document.getElementById("keyboard"), input, { layout: "ar" });

    // short times for the demo; a real kiosk waits longer
    const status = document.getElementById("status");
    const machine = createIdleMachine({
      promptAfterMs: 8000,
      resetAfterMs: 12000,
      onChange: (state) => {
        status.dataset.state = state;
        if (state === "expired") { input.value = ""; input.dispatchEvent(new Event("input")); }
      },
    });
    watchInput(machine);
    setInterval(() => {
      status.textContent = machine.status === "prompt"
        ? `هل ما زلت هنا؟ إعادة البدء بعد ${machine.secondsToReset} ثانية`
        : machine.status === "expired" ? "تمت إعادة البدء. المس الشاشة للمتابعة." : "نشط";
    }, 250);

    const prices = [[12500, "KWD", "ar-KW"], [45000, "SAR", "ar-SA"], [32000, "AED", "en-AE"], [18000, "MAD", "fr-MA"]];
    document.getElementById("prices").replaceChildren(...prices.map(([minor, currency, locale]) => {
      const li = document.createElement("li");
      li.textContent = `${isolate(locale)}: ${isolate(formatMoney(minor, { currency, locale }))}`
      return li;
    }));
  </script>
</body>
</html>
